<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Freelancer Hub</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- ============ ANIMATED BACKGROUND LAYERS ============ -->
  <div class="bg">
    <div class="bg__grid"></div>
    <div class="bg__glow bg__glow--primary"></div>
    <div class="bg__glow bg__glow--secondary"></div>
    <div class="bg__streak bg__streak--one"></div>
    <div class="bg__streak bg__streak--two"></div>
    <div class="bg__scanline"></div>

    <div class="bg__particles">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <!-- ============ TOP NAVIGATION ============ -->
  <header class="nav">
    <div class="nav__logo">
      <img class="nav__logo-mark" src="fh-icon.png" alt="Freelancer Hub" />
      <span class="nav__logo-text">Freelancer Hub</span>
    </div>

    <nav class="nav__links">
      <a href="#">Home</a>
      <a href="#">Explore Freelancers</a>
      <a href="#">How It Works</a>
      <a href="#">About</a>
    </nav>

    <div class="nav__actions">
      <a href="#" class="nav__signin">Sign In</a>
      <a href="#" class="nav__cta">Create Account</a>
    </div>
  </header>

  <!-- ============ MAIN LOGIN CARD ============ -->
  <main class="stage">
    <div class="card">

      <div class="card__ring" aria-hidden="true"></div>

      <div class="card__header">
        <img class="card__brand" src="fh-logo-full.png" alt="Freelancer Hub — Find skills. Build ideas." />
        <h1 class="card__title">Welcome back</h1>
        <p class="card__subtitle">Sign in to continue to Freelancer Hub</p>
      </div>

      <form class="card__form" onsubmit="return false;">
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
        </div>

        <div class="field-row">
          <label class="checkbox">
            <input type="checkbox" name="remember" />
            <span class="checkbox__box"></span>
            <span class="checkbox__label">Remember me</span>
          </label>

          <a href="#" class="link-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary">
          <span>Sign In</span>
        </button>
      </form>

      <p class="card__register">
        Don&rsquo;t have an account?
        <a href="#" class="link-accent">Create Account</a>
      </p>

      <div class="divider">
        <span>or continue with</span>
      </div>

      <div class="social-row">
        <button type="button" class="btn-social">
          <span class="btn-social__icon" aria-hidden="true">G</span>
          Google
        </button>
        <button type="button" class="btn-social">
          <span class="btn-social__icon" aria-hidden="true">⌥</span>
          GitHub
        </button>
      </div>

    </div>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <p class="footer__left">© 2026 Freelancer Hub</p>
    <div class="footer__right">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Contact</a>
    </div>
  </footer>

</body>
</html>
